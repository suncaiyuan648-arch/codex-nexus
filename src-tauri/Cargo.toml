[package]
name = "codex-nexus"
version = "0.1.0"
description = "Local Codex quota and token usage monitor"
authors = ["you"]
edition = "2021"

[lib]
name = "codex_nexus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
